# horarios/paradas.yaml — zonas, localidades y paradas.
#
# Fuente de verdad editada a mano (design.md, 2.3). Solo se incluyen las
# zonas, localidades y paradas que usan las 12 líneas migradas hasta ahora
# (Ochavillos-Córdoba, Pozoblanco-Córdoba, Belalcázar-Córdoba, Adamuz-Córdoba,
# Badajoz-Córdoba, Fuente Carreteros-Córdoba, Villaviciosa-Córdoba,
# Belalcázar-Pozoblanco y las 4 líneas de la hoja TORR). Las 3 restantes se
# añaden en la fase 1b-2.
#
# Zonas y localidades: negocio ha confirmado las de Coronada (Valle del
# Guadiato) y Cabeza del Buey (Los Pedroches). Lo que sigue abierto está
# declarado en `pendientes:`, al final (P18, P32).

