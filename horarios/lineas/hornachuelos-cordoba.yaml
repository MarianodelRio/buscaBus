# horarios/lineas/hornachuelos-cordoba.yaml
# Fuente: horarios_fuente/HORARIOS NUEVOS MODIFICADO.xlsx, hojas POSADAS INV y
# POSADAS VER.
#
# Rivero de Posadas y Los Mochos no son columnas: no tienen hora de paso propia
# (P32). Los viajes que pasan por Rivero (naranja en el Excel) llevan
# `pasa_por_rivero` y los que paran dentro de Los Mochos (verde) llevan
# `para_en_los_mochos`; la conversación ofrece "Usar Posadas" / "Usar Almodóvar".
# El asterisco del Excel (no para en El Pedrera, calle Sevilla) es la letra E
# en la celda de Posadas (P16): solo se muestra con origen o destino Posadas.
# Las notas internas de POSADAS VER r38/r39 no se publican (D-m).
#
# Posadas 08:30 (ida, lunes a viernes) ya no lleva asterisco: cambio de la
# empresa en el Excel modificado; ahora para en El Pedrera. No sale en "cambios
# desde la versión publicada" porque la línea es nueva.
#
# Domingo, 09:30 desde Hornachuelos: Posadas–Almodóvar 40 min y
# Almodóvar–Córdoba 20 min, se publica tal cual (P36; fila 45 de POSADAS INV y
# VER).
nombre: Hornachuelos – Córdoba
