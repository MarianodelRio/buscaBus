# config.yaml — Configuración del negocio. Rastreado en git.
#
# Decisiones con negocio (2026-10-08): operador Autocares San Sebastián (D9);
# en "Información" solo la web oficial por ahora (D10); los 8 pueblos del menú
# se quedan como están y se cambiarán si hace falta (D7). Ver design.md,
# sección 10.

negocio:
  nombre: "Autocares San Sebastián"    # D9
  telefono_contacto: "957 42 90 30"
  admin_phone: ""         # Fallback si no se define ADMIN_PHONE en .env. Solo dígitos, sin '+' ni espacios.

  horario_oficina:
    # Bloques de días con sus franjas [inicio, fin] en HH:MM (P19c). Solo se
    # muestra al cliente; el bot nunca calcula si la oficina está abierta.
    - dias: [lunes, martes, miercoles]
      franjas:
        - ["08:00", "15:00"]
        - ["17:00", "19:00"]
    - dias: [jueves, viernes]
      franjas:
        - ["08:00", "15:00"]

  enlaces:
    # D10: de momento solo la web oficial. Claves que muestra "Información"
    # (app/utils/messages.py, msg_info): web, compra_online, bonos,
    # pdf_horarios; las vacías u omitidas no salen.
    web: "https://www.autocaressansebastian.es"

# Los 8 pueblos que aparecen en la lista de inicio (paso ORIGEN, ver design.md 4.3).
# D7: negocio acepta esta lista por ahora (2026-10-08); se cambiará si hace
# falta. No usar el ranking de servicios del Excel tal cual: sobrevalora
# paradas de paso como Cruce de Villaharta o El Vacar.
pueblos_menu_inicio:
  - "Córdoba"
  - "Pozoblanco"
  - "Peñarroya-Pueblonuevo"
  - "Villanueva de Córdoba"
  - "Hinojosa del Duque"
  - "Belalcázar"
  - "Adamuz"
  - "Fuente Palmera"
