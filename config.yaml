negocio:
  nombre: "Autocares XX"    # TODO D9: confirmar operador y encargo
  telefono_contacto: "957 XX XX XX"    # TODO D9
  admin_phone: ""         # Fallback si no se define ADMIN_PHONE en .env. Solo dígitos, sin '+' ni espacios.

  horario_oficina:
    # Bloques de días con sus franjas [inicio, fin] en HH:MM (P19c). Solo se
    # muestra al cliente; el bot nunca calcula si la oficina está abierta.
    - dias: [lunes, martes, miercoles]
      franjas:
        - ["08:00", "15:00"]
        - ["17:00", "19:00"]
    - dias: [jueves, viernes]
      franjas:
        - ["08:00", "15:00"]

  enlaces:
    # TODO D10: confirmar qué enlaces van en el paso "Información" del menú.
    # Propuesta del design: compra online, bonos, PDF de horarios.
    # PRUEBA: URLs ficticias (example.com) para las pruebas por Telegram.
    # D10 sigue abierta: sustituir antes del despliegue con WhatsApp.
    compra_online: "https://example.com/compra-billetes"
    bonos: "https://example.com/bonos"
    pdf_horarios: "https://example.com/horarios.pdf"

