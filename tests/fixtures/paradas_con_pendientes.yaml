# Variante de paradas_base.yaml con el campo `pendientes:` (design.md 8,
# "Correcciones de la fase 1", punto 6): P12 afecta a la localidad
# "cordoba", que aquí no usa ninguna línea (solo se usa para comprobar que
# se resalta en la sección "Pueblos, paradas y zonas").
zonas:
  zona-test: Zona de prueba

localidades:
  pueblo-a: { nombre: Pueblo A, zona: zona-test }
  pueblo-b: { nombre: Pueblo B, zona: zona-test }
  pueblo-c: { nombre: Pueblo C, zona: zona-test }
  cordoba: { nombre: Córdoba, zona: zona-test }

paradas:
  AAA: { nombre: Pueblo A, localidad: pueblo-a }
  BBB: { nombre: Pueblo B, localidad: pueblo-b }
  CCC: { nombre: Pueblo C, localidad: pueblo-c }
  COR: { nombre: Córdoba, localidad: cordoba }

pendientes: [P12]
