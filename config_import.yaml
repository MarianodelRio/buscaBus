# config_import.yaml — Todo el conocimiento que el Excel no dice explícitamente.
#
# Lo escribe una persona una vez, a mano, hoja por hoja, y se versiona en git.
# tools/import_excel.py lee este fichero junto con HORARIOS NUEVOS.xlsx.
#
# Regla de oro (design.md, 2.3): ante lo desconocido, el importador falla,
# nunca adivina. Si aparece un color, un asterisco o un nombre de parada que
# no está aquí, el import debe abortar con un mensaje concreto.
#
# TODO: rellenar las 18 hojas. Ver design.md, sección 2.2, para el catálogo de
# problemas detectados en el Excel actual (colores, asteriscos, notas internas,
# filas ocultas, nombres inconsistentes, fechas de temporada incoherentes).
# Ver también D1, D2, D4, D5, D6.

# ── 1. Leyenda de colores por hoja ──────────────────────────────────────────
# Cada hoja usa su propia leyenda (design.md 2.2, punto 1). La clave de color
# es la que use el script (p.ej. ARGB de la celda); el valor es su significado.
leyendas_color:
  # Ejemplo (inventado, no usar tal cual):
  # POZOB INV:
  #   "FFFFFF00": a_demanda        # amarillo = a demanda
  #   "FF00B050": entra_en_pueblo  # verde = entra en el pueblo
  {}

# ── 2. Significado de los asteriscos por hoja ───────────────────────────────
# Los asteriscos significan cosas distintas en cada hoja (design.md 2.2, punto 2).
significado_asteriscos:
  # Ejemplo (inventado, no usar tal cual):
  # POZOB INV:
  #   "*": hora_aproximada
  #   "**": solo_viernes_lectivo
  {}

# ── 3. Alias y normalización de nombres de parada ───────────────────────────
# Recoge las variantes del Excel (design.md 2.2, punto 6) más los nombres
# coloquiales que aporte la empresa. Usado también por app/utils/matcher.py
# en tiempo de consulta (design.md 4.7).
alias_paradas:
  # Ejemplo (inventado, no usar tal cual):
  # "GUADALCAZAR":
  #   - "GUALDALCAZAR"
  #   - "GUADALCAZAR"
  # "STA EUFEMIA":
  #   - "ST EUFEMIA"
  #   - "STA EUFEMIA"
  # Caso que siempre debe preguntar (nunca resolverse solo, design.md 4.7):
  # "VILLAFRANCA" existe como Villafranca de Córdoba (línea Adamuz) y como
  # Villafranca de los Barros (línea Badajoz). No fusionar sus alias.
  {}

# ── 4. Agrupación parada → localidad → zona ─────────────────────────────────
# El usuario elige una localidad; el resultado muestra la parada (design.md 2.4).
# Cuidado: paradas que suenan iguales pero NO son el mismo sitio (p.ej.
# Villaharta y Cruce de Villaharta, ver D5) deben ir en localidades distintas.
# Zonas: Los Pedroches, Guadiato, Vega del Guadalquivir, Adamuz, Campiña,
# Extremadura, Córdoba (design.md 4.7, "Ver todos por zona").
agrupacion_paradas:
  # Ejemplo (inventado, no usar tal cual):
  # "Pozoblanco (estación)":
  #   localidad: "Pozoblanco"
  #   zona: "Los Pedroches"
  # "Pozoblanco (hospital)":
  #   localidad: "Pozoblanco"
  #   zona: "Los Pedroches"
  # "Cruce de Villaharta":
  #   localidad: "Cruce de Villaharta"   # NO fusionar con "Villaharta"
  #   zona: "Los Pedroches"
  {}
